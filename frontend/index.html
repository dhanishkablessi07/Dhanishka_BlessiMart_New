<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhanishka Blessi Mart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="nav-brand">
                <a href="#/">Dhanishka Blessi Mart</a>
            </div>
            <div class="nav-menu">
                <ul class="nav-links">
                    <li><a href="#/">Home</a></li>
                    <li><a href="#/products">Products</a></li>
                    <li><a href="#/cart">Cart <span id="cart-badge" class="badge badge-danger" style="display:none;"></span></a></li>
                    <li id="nav-seller" style="display:none;"><a href="#/seller">Seller</a></li>
                    <li id="nav-admin" style="display:none;"><a href="#/admin">Admin</a></li>
                </ul>
                <div class="nav-auth" id="nav-auth">
                    <a href="#/login" class="btn btn-sm btn-outline">Login</a>
                    <a href="#/register" class="btn btn-sm btn-primary">Register</a>
                </div>
                <div class="nav-user" id="nav-user" style="display:none;">
                    <a href="#/orders">Orders</a>
                    <span id="nav-username" class="username"></span>
                    <a href="#/logout" class="btn btn-sm btn-outline">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main id="app">
        <!-- Content rendered here -->
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 BlessiMart. All rights reserved.</p>
        </div>
    </footer>

    <div id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/product-detail.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/orders.js"></script>
    <script src="/js/seller.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/chat.js"></script>
    <script>
        // Init pages
        document.addEventListener('DOMContentLoaded', () => {
             AuthPage.init();
            if(window.ProductsPage) ProductsPage.init();
            if(window.ProductDetailPage) ProductDetailPage.init();
             CartPage.init();
             OrdersPage.init();
            if(window.SellerPage) SellerPage.init();
             AdminPage.init();
            App.init();
        });
    </script>
</body>
</html>
